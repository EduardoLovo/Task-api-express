# Sobe só a API Express:  docker compose up --build
# O JWT_SECRET é lido do arquivo .env desta pasta.

services:
  express:
    build: .
    image: task-api-express
    init: true
    ports:
      - "${EXPRESS_PORT:-3000}:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BODY_LIMIT: ${BODY_LIMIT:-100kb}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    volumes:
      - express-data:/app/data
    # Tempo para o graceful shutdown (10 s no server.js) antes do SIGKILL.
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  express-data:
