name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: actionlint (workflows do GitHub Actions)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 é a versão mínima suportada (package.json → engines); 24 é a usada no Docker.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        run: npm run test:coverage

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: task-api-express:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir o container e esperar o health check
        run: |
          docker run -d --name api -p 3000:3000 \
            -e JWT_SECRET="$(openssl rand -hex 48)" task-api-express:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "Health: $status"
          [ "$status" = "healthy" ]

      - name: Testar a API dentro do container
        run: |
          curl -fsS http://localhost:3000/health
          # Erro no formato padrão: 401 com code MISSING_TOKEN.
          body=$(curl -s -w '\n%{http_code}' http://localhost:3000/tasks)
          echo "$body"
          echo "$body" | tail -1 | grep -qx 401
          echo "$body" | head -1 | grep -q '"code":"MISSING_TOKEN"'

      - name: Encerramento controlado (SIGTERM → código 0)
        run: |
          docker stop api
          code=$(docker inspect --format '{{.State.ExitCode}}' api)
          echo "Código de saída: $code"
          [ "$code" = "0" ]

      - name: Logs do container
        if: always()
        run: docker logs api || true
