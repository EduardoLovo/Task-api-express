# Atualizações automáticas de dependências. Cada pull request passa pelo CI.
# Referência: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Pacotes do package.json / package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    # Espera alguns dias depois de uma versão sair: versões com defeito ou
    # comprometidas costumam ser retiradas nesse intervalo.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Atualizações menores (minor/patch) chegam num PR só; majors, que podem
    # quebrar a API, chegam em PRs separados.
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  # Versões das actions usadas em .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  # Imagem base do Dockerfile (node:24-alpine)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    ignore:
      # Trocar a versão principal do Node (ex.: 24 → 26) é decisão manual:
      # versões ímpares não são LTS e a troca pede revisar o package.json (engines).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(docker)'
